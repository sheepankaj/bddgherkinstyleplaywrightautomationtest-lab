version: '3.8'

services:
  playwright-tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parabank-bdd-tests
    environment:
      - CI=true
      - BASE_URL=https://parabank.parasoft.com
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
